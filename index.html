<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f5c4d" />
    <title>LATTE LAB Order</title>
    <link rel="icon" href="image/logo.JPG" />
    <link rel="stylesheet" href="styles.css" />
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="config.js"></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand-lockup">
          <img class="brand-logo" src="image/logo.JPG" alt="LATTE LAB logo" />
          <div>
            <h1 id="brandName">LATTE LAB</h1>
          </div>
        </div>
        <button class="icon-button cart-button" id="cartToggle" type="button" aria-label="Open cart">
          <i data-lucide="shopping-bag" aria-hidden="true"></i>
          <span class="cart-count" id="cartCount">0</span>
        </button>
      </header>

      <!-- Tab Navigation -->
      <nav class="main-tabs" aria-label="Main navigation">
        <button class="main-tab is-active" id="tabMenu" type="button">
          <i data-lucide="coffee" aria-hidden="true"></i>
          Menu
        </button>
        <button class="main-tab" id="tabOrders" type="button">
          <i data-lucide="clipboard-list" aria-hidden="true"></i>
          My Orders
          <span class="tab-badge" id="ordersBadge" hidden>0</span>
        </button>
      </nav>

      <!-- Menu Section -->
      <section id="menuSection">
        <div class="order-tools" aria-label="Menu tools">
          <label class="search-box">
            <i data-lucide="search" aria-hidden="true"></i>
            <input id="searchInput" type="search" placeholder="Search drinks" autocomplete="off" />
          </label>
          <label class="check-pill">
            <input id="promoOnly" type="checkbox" />
            <span>Promo</span>
          </label>
          <div class="currency-toggle" aria-label="Currency">
            <button class="segment is-active" type="button" data-currency="USD">USD</button>
            <button class="segment" type="button" data-currency="KHR">KHR</button>
          </div>
        </div>

        <nav class="category-tabs" id="categoryTabs" aria-label="Drink categories"></nav>

        <main>
          <div class="status-line" id="dataStatus">Loading menu from Excel...</div>
          <section class="menu-grid" id="menuGrid" aria-live="polite"></section>
        </main>
      </section>

      <!-- Orders Section -->
      <section id="ordersSection" hidden>
        <div class="orders-header">
          <p class="orders-status" id="ordersStatus"></p>
        </div>
        <div class="orders-list" id="ordersList">
          <div class="empty-state">
            <i data-lucide="loader-circle"></i>
            <p>Loading...</p>
          </div>
        </div>
      </section>

      <footer class="site-footer">
        <p><a href="tel:086785878">Chea 086785878</a></p>
      </footer>
    </div>

    <div class="drawer-backdrop" id="drawerBackdrop" hidden></div>
    <aside class="cart-drawer" id="cartDrawer" aria-label="Order cart" aria-hidden="true">
      <div class="drawer-header">
        <div>
          <p class="eyebrow">Current order</p>
          <h2>Your cart</h2>
        </div>
        <div class="drawer-actions">
          <button class="text-button" id="cartClear" type="button" hidden>Clear</button>
          <button class="icon-button" id="cartClose" type="button" aria-label="Close cart">
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>
      </div>

      <div class="cart-items" id="cartItems"></div>

      <form class="checkout-form" id="checkoutForm">
        <fieldset>
          <legend>Order type</legend>
          <div class="fulfillment-group">
            <label><input type="radio" name="fulfillment_method" value="pickup" checked /> Pickup</label>
            <label><input type="radio" name="fulfillment_method" value="dine_in" /> Dine-in</label>
            <label><input type="radio" name="fulfillment_method" value="delivery" /> Delivery</label>
          </div>
        </fieldset>

        <div class="form-grid">
          <label>
            Name
            <input id="customerName" name="customer_name" type="text" autocomplete="name" />
          </label>
          <label>
            Phone
            <input name="phone" type="tel" autocomplete="tel" />
          </label>
        </div>

        <label class="address-field" id="addressField">
          Address or table
          <input name="address" type="text" autocomplete="street-address" />
        </label>

        <label>
          Notes
          <textarea name="note" rows="3" placeholder="Less ice, less sugar, pickup time..."></textarea>
        </label>

        <div class="summary">
          <div>
            <span>Items</span>
            <strong id="summaryItems">0</strong>
          </div>
          <div>
            <span>Total</span>
            <strong id="summaryTotal">$0.00</strong>
          </div>
        </div>

        <button class="primary-button" id="submitOrder" type="submit">
          <i data-lucide="send" aria-hidden="true"></i>
          Place order
        </button>
        <p class="submit-note" id="submitNote"></p>
      </form>
    </aside>

    <button class="mobile-cart-bar" id="mobileCartBar" type="button">
      <span id="mobileCartLabel">Cart is empty</span>
      <strong id="mobileCartTotal">$0.00</strong>
    </button>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <!-- Order Success Modal -->
    <div class="success-overlay" id="successOverlay" hidden>
      <div class="success-card">
        <div class="success-icon"><i data-lucide="check-circle"></i></div>
        <h2>Order Placed!</h2>
        <p class="success-order-id" id="successOrderId"></p>
        <p class="success-note">Please save your order ID for reference.</p>
        <button class="primary-button" id="successClose" type="button">OK</button>
      </div>
    </div>

    <!-- Image Lightbox -->
    <div class="image-lightbox" id="imageLightbox">
      <div class="lightbox-name" id="lightboxName"></div>
      <img id="lightboxImage" src="" alt="" />
      <div class="lightbox-price" id="lightboxPrice"></div>
    </div>
  </body>
</html>
